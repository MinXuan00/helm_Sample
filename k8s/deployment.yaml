apiVersion: apps/v1
kind: Deployment
metadata:
  name: airflow
  namespace: airflow
spec:
  replicas: 1
  selector:
    matchLabels:
      app: airflow
  template:
    metadata:
      labels:
        app: airflow
    spec:
      containers:
      - name: airflow
        image: apache/airflow:2.10.3
        imagePullPolicy: IfNotPresent
        envFrom:
        - configMapRef:
            name: airflow-config
        ports:
        - containerPort: 8080
        volumeMounts:
        - name: airflow-db
          mountPath: /opt/airflow
      volumes:
      - name: airflow-db
        emptyDir: {}
